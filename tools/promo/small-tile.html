<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Small promo tile</title>
    <style>
      /* Rendered at exactly 440x280 by tools/generate-store-assets.mjs.
       * This one appears small and in a grid, so it carries the mark and the
       * name only; the seam is reduced to a single sliver of light at the edge
       * — enough to read as "light becomes dark" at thumbnail size. */
      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body { width: 440px; height: 280px; overflow: hidden; }
      body {
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        background: #000;
        position: relative;
        display: flex;
        align-items: center;
      }

      .sliver { position: absolute; left: 0; top: 0; bottom: 0; width: 34px; background: #f4f2ee; }
      .seam { position: absolute; left: 34px; top: 0; bottom: 0; width: 2px; background: #70b5f9; }

      .copy {
        position: relative;
        margin-left: 72px;
        margin-right: 28px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .mark { width: 56px; height: 56px; display: block; }

      h1 {
        font-size: 33px;
        line-height: 1.08;
        letter-spacing: -0.026em;
        font-weight: 700;
        color: rgba(245, 245, 245, 0.92);
      }

      p {
        font-size: 15px;
        line-height: 1.4;
        color: rgba(245, 245, 245, 0.55);
      }
    </style>
  </head>
  <body>
    <div class="sliver"></div>
    <div class="seam"></div>

    <div class="copy">
      <svg class="mark" viewBox="0 0 128 128" aria-hidden="true">
        <rect width="128" height="128" rx="28" fill="#1b1f23" />
        <mask id="crescent">
          <rect width="128" height="128" fill="black" />
          <circle cx="59" cy="64" r="38" fill="white" />
          <circle cx="81" cy="46" r="35" fill="black" />
        </mask>
        <rect width="128" height="128" fill="#70b5f9" mask="url(#crescent)" />
      </svg>
      <h1>Dark Mode<br />for LinkedIn</h1>
      <p>Without the glare.</p>
    </div>
  </body>
</html>
